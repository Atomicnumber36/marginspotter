<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarginSpotter</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17212b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:24px 16px 60px}header{margin-bottom:24px}h1{margin:0;font-size:2rem}p{color:#65717e}section{background:white;border:1px solid #e3e8ed;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 14px #10203008}h2{font-size:1.15rem;margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px}input,select{width:100%;border:1px solid #ccd5dd;border-radius:9px;padding:12px;font:inherit;background:white}button{border:0;border-radius:10px;background:#17212b;color:white;padding:12px 18px;font-weight:650;cursor:pointer}button.secondary{background:#edf0f3;color:#17212b}button.danger{background:#fff0f0;color:#a22}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8cb8ff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.item{border-top:1px solid #edf0f2;padding:14px 0}.item:first-child{border:0}.meta{color:#65717e;font-size:.85rem}.positive{color:#087b53;font-weight:700}.negative{color:#b43838;font-weight:700}.stat{font-size:1.5rem;font-weight:750}small{color:#65717e}@media(max-width:450px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main><header><h1>MarginSpotter</h1><p>Find plads til fortjeneste. Priserne indtaster du selv – dine data gemmes lokalt i denne browser.</p></header>
<section><h2>Opret Spotter</h2><form id="form"><div class="grid">
<div class="full"><label for="name">Hvad vil du spotte?</label><input id="name" required maxlength="120" placeholder="Fx Pokémon Blue, iPhone 13 eller kamera"></div>


<div><label for="loose">Forventet salgspris (kr.)</label><input id="loose" type="number" min="0" step=".01" required placeholder="0"></div>

<div><label for="target">Minimumsafkast (%)</label><input id="target" type="number" min="0" step="1" value="20" required></div>
</div><div class="actions"><button type="submit">Opret Spotter</button></div></form></section>
<section><h2>Beregn en handel</h2><div class="grid">
<div><label for="product">Produkt</label><select id="product"></select></div>
<div><label for="purchase">Købspris (kr.)</label><input id="purchase" type="number" min="0" step=".01" value="0"></div>
<div><label for="shipping">Fragt ved køb (kr.)</label><input id="shipping" type="number" min="0" step=".01" value="0"></div>
<div><label for="fees">Salgsomkostninger (kr.)</label><input id="fees" type="number" min="0" step=".01" value="0"></div>
<div><label for="buffer">Prisbuffer (%)</label><input id="buffer" type="number" min="0" max="100" step="1" value="10"></div>
</div><div id="result" aria-live="polite" style="margin-top:16px"></div></section>
<section><h2>Mine Spottere</h2><div id="items"></div></section>
</main><script>
const key='marginspotter.products.v1';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('da-DK',{style:'currency',currency:'DKK'}).format(n);let products=[];
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))products=saved}catch{}

function num(id){const raw=$(id).value;return raw===''?null:Number(raw)}
function persist(){try{localStorage.setItem(key,JSON.stringify(products))}catch{alert('Browseren kunne ikke gemme data. Kontroller lagerindstillinger.')}}
function el(tag,text,cls){const node=document.createElement(tag);node.textContent=text;if(cls)node.className=cls;return node}
function render(){const selected=$('product').value;$('product').replaceChildren();products.forEach(p=>{const opt=document.createElement('option');opt.value=p.id;opt.textContent=p.name;$('product').append(opt)});if(products.some(p=>p.id===selected))$('product').value=selected;
$('items').replaceChildren();if(!products.length)$('items').append(el('p','Ingen produkter endnu.'));
products.forEach(p=>{const box=el('div','','item');box.append(el('strong',p.name+' · '+(p.category||'Øvrigt')),el('div','Minimumsafkast: '+(p.target??20)+' % · opdateret '+p.date,'meta'),el('div','Forventet salgspris: '+(p.loose===null?'Ikke angivet':money(p.loose)),'meta'));const edit=el('button','Opdater priser','secondary');edit.type='button';edit.onclick=()=>{const a=prompt('Ny loose-pris (blank = ikke angivet)',p.loose??'');if(a===null)return;const valid=s=>s.trim()===''||Number.isFinite(Number(s))&&Number(s)>=0;if(!valid(a)){alert('Indtast gyldige ikke-negative priser.');return}p.loose=a.trim()===''?null:Number(a);p.date=new Date().toLocaleDateString('en-CA');persist();render()};const remove=el('button','Slet','danger');remove.type='button';remove.onclick=()=>{if(confirm('Slet '+p.name+'?')){products=products.filter(x=>x.id!==p.id);persist();render()}};const actions=el('div','','actions');actions.append(edit,remove);box.append(actions);$('items').append(box)});calculate()}
function calculate(){const p=products.find(x=>x.id===$('product').value);const out=$('result');out.replaceChildren();if(!p){out.append(el('p','Opret en Spotter for at beregne en handel.'));return}const market=p.loose;if(market===null){out.append(el('p','Indtast først en markedspris for denne stand.'));return}const purchase=num('purchase'),shipping=num('shipping'),fees=num('fees'),buffer=num('buffer');if([purchase,shipping,fees,buffer].some(x=>x===null||!Number.isFinite(x)||x<0)||buffer>100){out.append(el('p','Angiv gyldige beløb og en buffer mellem 0 og 100 %.'));return}const resale=market*(1-buffer/100),invested=purchase+shipping,profit=resale-fees-invested,roi=invested>0?profit/invested*100:null,maxBuy=(resale-fees)/1.2-shipping;out.append(el('div','Forsigtig salgspris: '+money(resale),'meta'),el('div','Forventet fortjeneste: '+money(profit),'stat'),el('div','Afkast: '+(roi===null?'Ikke beregneligt ved 0 kr. investering':roi.toFixed(1)+' %'),roi!==null&&roi>=target?'positive':'negative'),el('div','Maks. købspris for '+target+' % afkast: '+(maxBuy>=0?money(maxBuy):'Ingen rentabel købspris'),'meta'));if(Date.now()-new Date(p.date+'T12:00:00').getTime()>30*86400000)out.append(el('p','Bemærk: Markedsprisen er over 30 dage gammel.'))}
$('form').addEventListener('submit',e=>{e.preventDefault();const loose=num('loose'),cib=null;if([loose,cib].some(v=>v!==null&&(!Number.isFinite(v)||v<0))){alert('Priser skal være positive tal.');return}products.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),name:$('name').value.trim(),platform:'',region:'',loose,cib,target:num('target'),date:new Date().toLocaleDateString('en-CA')});persist();$('form').reset();render()});['product','purchase','shipping','fees','buffer'].forEach(id=>$(id).addEventListener('input',calculate));render();
</script></body></html>
