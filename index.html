<script>
const feed=document.getElementById('feed'),search=document.getElementById('search'),count=document.getElementById('count'),status=document.getElementById('status');
let listings=[],updatedAt=null;const savedKey='flipit.saved.v1';let saved=new Set(JSON.parse(localStorage.getItem(savedKey)||'[]'));const icon=(name)=>name==='bookmark'?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17l-7-5-7 5z"/></svg>':name==='share'?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L7 8m5-5 5 5M5 13v7h14v-7"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>';
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
function attachSwipe(target,change){let startX=0,startY=0,active=false;target.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY;active=true},{passive:true});target.addEventListener('touchend',e=>{if(!active||!e.changedTouches.length)return;active=false;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25){change(dx<0?1:-1);target.dataset.swiped='1';setTimeout(()=>delete target.dataset.swiped,350)}},{passive:true});target.addEventListener('touchcancel',()=>{active=false},{passive:true})}
function openLightbox(photos,start=0){if(!photos.length)return;const overlay=el('div','lightbox'),image=el('img');let ix=start;const previous=document.activeElement;const show=()=>{image.src=photos[ix];image.alt='Annoncebillede '+(ix+1)+' af '+photos.length;counter.textContent=(ix+1)+' / '+photos.length};const close=()=>{document.removeEventListener('keydown',keys);overlay.remove();document.body.style.overflow='';previous?.focus?.()};const keys=e=>{if(e.key==='Escape')close();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)};const move=n=>{ix=(ix+n+photos.length)%photos.length;show()};const button=(cls,label,fn)=>{const b=el('button',cls,label);b.type='button';b.onclick=fn;return b};const counter=el('span','counter');overlay.append(image,button('close','×',close),counter);attachSwipe(image,move);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.body.append(overlay);document.body.style.overflow='hidden';document.addEventListener('keydown',keys);show();overlay.querySelector('.close').focus()}
const money=n=>new Intl.NumberFormat('da-DK',{maximumFractionDigits:0}).format(n);
let sekToDkk=null;
const dkk=n=>sekToDkk===null?'Kurs utilgængelig':money(Math.round(Number(n)*sekToDkk))+' kr.';
async function loadExchangeRate(){try{const response=await fetch('https://api.frankfurter.dev/v1/latest?base=SEK&symbols=DKK',{cache:'no-store'});if(!response.ok)throw Error('Valutakurs ikke tilgængelig');const data=await response.json();const rate=Number(data.rates?.DKK);if(!Number.isFinite(rate)||rate<=0)throw Error('Ugyldig valutakurs');sekToDkk=rate;render()}catch(error){console.warn('Kunne ikke hente SEK/DKK-valutakurs',error)}}
function render(){
 const q=search.value.trim().toLocaleLowerCase('da-DK');
 const type=document.getElementById('filterType').value,max=document.getElementById('filterPrice').value,sort=document.getElementById('sortBy').value;
  const matches=listings.filter(x=>(!q||(String(x.title||'')+' '+String(x.query||'')).toLocaleLowerCase('da-DK').includes(q))&&(type==='all'||(type==='auction'?['auction','auction_buy_now'].includes(x.listingType):['buy_now','auction_buy_now'].includes(x.listingType)))&&(max==='all'||(x.price!=null&&Number.isFinite(Number(x.price))&&sekToDkk!==null&&Number(x.price)*sekToDkk<=Number(max))));
  if(sort==='priceAsc')matches.sort((a,b)=>(a.price==null?Infinity:Number(a.price))-(b.price==null?Infinity:Number(b.price)));
  if(sort==='priceDesc')matches.sort((a,b)=>(b.price==null?-Infinity:Number(b.price))-(a.price==null?-Infinity:Number(a.price)));
  if(sort==='ending')matches.sort((a,b)=>(a.endDate&&Number.isFinite(Date.parse(a.endDate))?Date.parse(a.endDate):Infinity)-(b.endDate&&Number.isFinite(Date.parse(b.endDate))?Date.parse(b.endDate):Infinity));
 count.textContent=matches.length+' annoncer';feed.replaceChildren();
 if(!matches.length){feed.append(el('div','empty',q?'Ingen annoncer matcher din søgning.':'Ingen annoncer i feedet endnu.'));return}
 const fragment=document.createDocumentFragment();
 for(const item of matches){
  const url=String(item.url||'');if(!/^https:\/\/www\.tradera\.com\//.test(url))continue;
  const post=el('article','post');
  const top=el('div','post-top');top.append(el('span','source','Tradera'));
  const type=item.listingType==='auction'?'Auktion':item.listingType==='buy_now'?'Køb nu':item.listingType==='auction_buy_now'?'Auktion · Køb nu':'Annonce';top.append(el('span','type',type));post.append(top);
  const photos=[...new Set([...(Array.isArray(item.imageUrls)?item.imageUrls:[]),item.imageUrl].filter(u=>typeof u==='string'&&/^https:\/\//.test(u)))];
  const photo=el('div','photo');
  if(photos.length){const img=el('img');img.loading='lazy';img.alt='Foto af '+String(item.title||'annoncen');let ix=0;img.src=photos[0];img.addEventListener('click',()=>{if(photo.dataset.swiped)return;openLightbox(photos,ix)});img.setAttribute('title','Vis billedet i fuld størrelse');photo.append(img);
   if(photos.length>1){const badge=el('span','photo-count','1 / '+photos.length);const dots=el('div','image-dots');for(let j=0;j<Math.min(photos.length,8);j++)dots.append(el('i',j===0?'active':''));const change=step=>{ix=(ix+step+photos.length)%photos.length;img.src=photos[ix];badge.textContent=(ix+1)+' / '+photos.length;[...dots.children].forEach((d,j)=>d.classList.toggle('active',j===ix))};post._dots=dots;
    attachSwipe(photo,change);photo.append(badge)}
  }else photo.append(el('span','missing','Intet billede'));post.append(photo);
  const actions=el('div','post-actions');const share=el('button','action');share.type='button';share.innerHTML=icon('share');share.setAttribute('aria-label','Del annonce');share.onclick=async()=>{if(navigator.share){try{await navigator.share({title:String(item.title||'Flipit fund'),url})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(url);share.setAttribute('aria-label','Link kopieret')}};const bookmark=el('button','action bookmark'+(saved.has(String(item.id))?' saved':''));
 bookmark.type='button';bookmark.innerHTML=icon('bookmark');const updateBookmark=()=>{const on=saved.has(String(item.id));bookmark.classList.toggle('saved',on);bookmark.setAttribute('aria-label',on?'Fjern fra gemte fund':'Gem fund');bookmark.setAttribute('aria-pressed',String(on))};updateBookmark();bookmark.onclick=()=>{const id=String(item.id);if(saved.has(id))saved.delete(id);else saved.add(id);localStorage.setItem(savedKey,JSON.stringify([...saved]));updateBookmark()};actions.append(share,bookmark);post.append(actions);if(post._dots)post.append(post._dots);
  const body=el('div','body');body.append(el('h2','title',String(item.title||'Ukendt vare')));
  const prices=el('div','prices'),left=el('div','price');
  const amount=Number(item.price);left.append(document.createTextNode(Number.isFinite(amount)&&item.price!==null?dkk(amount):'Pris ukendt'));
  if(item.buyNowPrice!=null&&Number(item.buyNowPrice)!==amount)left.append(el('small','', ' · Køb nu '+dkk(Number(item.buyNowPrice))));
  const valuationKey='flipit-market-value-'+String(item.id);
  const stored=localStorage.getItem(valuationKey);
  const valuation=el('details','valuation-details');
  const valuationLabel=amount=>{
    if(!Number.isFinite(amount)||amount<=0)return 'Ikke prisvurderet';
    if(sekToDkk===null||item.price==null||!Number.isFinite(Number(item.price)))return 'Vurdering afventer kurs';
    const freight=item.shipping==null?null:Number(item.shipping);
    const cost=(Number(item.price)+(freight===null?0:freight))*sekToDkk;
    if(!Number.isFinite(cost)||cost<=0)return 'Pris ukendt';
    const roi=(amount-cost)/cost*100;
    const pct=new Intl.NumberFormat('da-DK',{maximumFractionDigits:0}).format(roi)+' %';
    if(freight===null)return 'Foreløbig ROI: '+pct+' (uden fragt)';
    return (roi>=20?'God handel':'Under 20 % mål')+' · ROI '+pct;
  };
  const summary=el('summary','evaluation valuation-trigger',valuationLabel(Number(stored)));
  const editor=el('form','valuation-editor');
  const valueInput=el('input');valueInput.type='number';valueInput.min='1';valueInput.step='1';valueInput.inputMode='decimal';valueInput.required=true;valueInput.placeholder='Beløb i kr.';valueInput.setAttribute('aria-label','Forventet markedsværdi i kroner');valueInput.value=stored||'';
  const confirm=el('button','','OK');confirm.type='submit';
  editor.append(valueInput,confirm);valuation.append(summary,editor);
  prices.append(left,valuation);body.append(prices);
  editor.addEventListener('submit',event=>{event.preventDefault();const amount=Number(valueInput.value);if(!Number.isFinite(amount)||amount<=0)return;localStorage.setItem(valuationKey,String(amount));summary.textContent=valuationLabel(amount);valuation.open=false});
  const meta=[];if(item.shipping!=null)meta.push('Fragt: '+dkk(Number(item.shipping)));else meta.push('Fragt ikke oplyst');if(item.endDate){const d=new Date(item.endDate);if(!isNaN(d))meta.push('Slutter '+d.toLocaleDateString('da-DK',{day:'numeric',month:'short'}))}body.append(el('p','sub',meta.join(' · ')));
  const desc=String(item.descriptionDa||item.description||'').trim();if(desc){const details=el('div','description'),preview=el('p','description-text',desc),toggle=el('button','description-toggle','Vis mere');toggle.type='button';toggle.setAttribute('aria-expanded','false');details.append(preview);if(desc.length>160){details.append(toggle);toggle.addEventListener('click',()=>{const expanded=details.classList.toggle('expanded');toggle.textContent=expanded?'Vis mindre':'Vis mere';toggle.setAttribute('aria-expanded',String(expanded))})}else details.classList.add('expanded');body.append(details)}
  const a=el('a','cta','Se annonce på Tradera');a.href=url;a.target='_blank';a.rel='noopener noreferrer';body.append(a);post.append(body);fragment.append(post);
 }
 feed.append(fragment);
}
async function load(){
 try{const r=await fetch('./data/tradera-listings.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(data.status!=='ok'||!Array.isArray(data.listings))throw Error('Ugyldigt annoncefeed');
 listings=data.listings;updatedAt=data.updatedAt;const time=updatedAt?new Date(updatedAt).toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'ukendt';status.textContent='Opdateret '+time;render()
 }catch(e){status.textContent='Feed ikke tilgængeligt';if(!listings.length)feed.replaceChildren(el('div','empty','Kunne ikke hente annoncer. Prøv igen senere.'))}
}
