<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8faf9"><meta name="description" content="Flipit: ét enkelt feed med retrospil og konsoller fra Tradera.">
<title>Flipit · Fund</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#192b28;background:#f8faf9}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:inherit}header{position:sticky;top:0;z-index:10;background:#f8faf9f2;backdrop-filter:blur(16px);border-bottom:1px solid #e4ebe7}.bar{max-width:620px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:12px}.logo{height:44px;width:126px;object-fit:contain;object-position:left center}.status{font-size:.73rem;color:#577268;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;background:#27a36b;border-radius:50%;margin-right:5px}.wrap{max-width:620px;margin:0 auto;padding:14px 12px 64px}.intro{display:flex;justify-content:space-between;align-items:baseline;padding:3px 4px 12px}.intro h1{font-size:1.18rem;letter-spacing:-.03em;margin:0}.count{font-size:.8rem;color:#73847c}.search{width:100%;border:1px solid #dfe7e3;border-radius:13px;padding:13px 15px;background:#fff;margin-bottom:17px;outline-color:#30956b;font-size:16px}.feed{display:grid;gap:18px}.post{background:white;border:1px solid #e2e9e5;border-radius:18px;overflow:hidden;box-shadow:0 4px 20px #193c2b08}.post-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px}.source{font-weight:750;font-size:.85rem}.type{font-size:.73rem;color:#667a70;background:#f0f5f2;padding:5px 9px;border-radius:20px}.photo{position:relative;aspect-ratio:1/1;background:#eef3f0;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.photo .missing{color:#87988f;font-size:.9rem}.photo button{position:absolute;top:50%;transform:translateY(-50%);background:#fffdf0e8;border:0;border-radius:50%;width:34px;height:34px;font-size:22px;display:grid;place-items:center}.photo .prev{left:10px}.photo .next{right:10px}.photo .photo-count{position:absolute;bottom:12px;right:12px;background:#1d3028bd;color:#fff;padding:5px 9px;border-radius:20px;font-size:.7rem}.body{padding:16px}.title{font-size:1.04rem;line-height:1.4;font-weight:750;margin:0 0 9px;overflow-wrap:anywhere}.prices{display:flex;justify-content:space-between;gap:12px;align-items:center}.price{font-size:1.35rem;font-weight:800;letter-spacing:-.04em}.price small{font-size:.73rem;font-weight:500;color:#75877d;letter-spacing:0}.evaluation{font-size:.74rem;color:#82662b;background:#fff7e5;padding:7px 9px;border-radius:8px}.sub{font-size:.77rem;color:#78887f;margin:10px 0 0}.description{margin-top:12px;border-top:1px solid #edf1ee;padding-top:12px;font-size:.84rem;color:#52675c;line-height:1.5}.description summary{cursor:pointer;font-weight:600}.description p{white-space:pre-wrap;max-height:220px;overflow:auto}.cta{display:block;margin-top:14px;text-align:center;background:#1d7953;color:#fff;text-decoration:none;font-weight:750;padding:13px;border-radius:11px}.empty{text-align:center;background:white;border:1px dashed #d8e4dc;border-radius:16px;padding:42px 18px;color:#697d71}.footnote{font-size:.75rem;color:#7d8d83;text-align:center;margin:24px 12px;line-height:1.5}@media(min-width:700px){.wrap{padding-top:20px}.post{border-radius:22px}}@media(prefers-reduced-motion:no-preference){.post{animation:appear .25s ease both}@keyframes appear{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style></head><body>
<header><div class="bar"><img class="logo" src="./flipit-logo.svg" alt="Flipit"><span class="status" id="status"><span class="dot"></span>Indlæser fund…</span></div></header>
<main class="wrap"><div class="intro"><h1>Fund til dig</h1><span class="count" id="count"></span></div><input class="search" id="search" type="search" placeholder="Søg efter spil eller konsol…" aria-label="Søg i fund">
<div class="feed" id="feed" aria-live="polite"><div class="empty">Henter annoncer fra Tradera…</div></div>
<p class="footnote">Annoncerne er endnu ikke verificeret som gode handler. Prisvurdering og beregning af maksbud tilføjes, når vi har pålidelige markedspriser. Køb gennemføres kun på Tradera.</p></main>
<script>
const feed=document.getElementById('feed'),search=document.getElementById('search'),count=document.getElementById('count'),status=document.getElementById('status');
let listings=[],updatedAt=null;
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
const money=n=>new Intl.NumberFormat('da-DK',{maximumFractionDigits:0}).format(n);
function render(){
 const q=search.value.trim().toLocaleLowerCase('da-DK');
 const matches=listings.filter(x=>!q||(String(x.title||'')+' '+String(x.query||'')).toLocaleLowerCase('da-DK').includes(q));
 count.textContent=matches.length+' annoncer';feed.replaceChildren();
 if(!matches.length){feed.append(el('div','empty',q?'Ingen annoncer matcher din søgning.':'Ingen annoncer i feedet endnu.'));return}
 const fragment=document.createDocumentFragment();
 for(const item of matches){
  const url=String(item.url||'');if(!/^https:\/\/www\.tradera\.com\//.test(url))continue;
  const post=el('article','post');
  const top=el('div','post-top');top.append(el('span','source','Tradera'));
  const type=item.listingType==='auction'?'Auktion':item.listingType==='buy_now'?'Køb nu':item.listingType==='auction_buy_now'?'Auktion · Køb nu':'Annonce';top.append(el('span','type',type));post.append(top);
  const photos=[...new Set([...(Array.isArray(item.imageUrls)?item.imageUrls:[]),item.imageUrl].filter(u=>typeof u==='string'&&/^https:\/\//.test(u)))];
  const photo=el('div','photo');
  if(photos.length){const img=el('img');img.loading='lazy';img.alt='Foto af '+String(item.title||'annoncen');let ix=0;img.src=photos[0];photo.append(img);
   if(photos.length>1){const badge=el('span','photo-count','1 / '+photos.length);const change=step=>{ix=(ix+step+photos.length)%photos.length;img.src=photos[ix];badge.textContent=(ix+1)+' / '+photos.length};
    const prev=el('button','prev','‹'),next=el('button','next','›');prev.type=next.type='button';prev.setAttribute('aria-label','Forrige billede');next.setAttribute('aria-label','Næste billede');prev.onclick=()=>change(-1);next.onclick=()=>change(1);photo.append(prev,next,badge)}
  }else photo.append(el('span','missing','Intet billede'));post.append(photo);
  const body=el('div','body');body.append(el('h2','title',String(item.title||'Ukendt vare')));
  const prices=el('div','prices'),left=el('div','price');
  const amount=Number(item.price);left.append(document.createTextNode(Number.isFinite(amount)&&item.price!==null?money(amount)+' SEK':'Pris ukendt'));
  if(item.buyNowPrice!=null&&Number(item.buyNowPrice)!==amount)left.append(el('small','', ' · Køb nu '+money(Number(item.buyNowPrice))+' SEK'));
  prices.append(left,el('span','evaluation','Ikke prisvurderet'));body.append(prices);
  const meta=[];if(item.shipping!=null)meta.push('Fragt: '+money(Number(item.shipping))+' SEK');else meta.push('Fragt ikke oplyst');if(item.endDate){const d=new Date(item.endDate);if(!isNaN(d))meta.push('Slutter '+d.toLocaleDateString('da-DK',{day:'numeric',month:'short'}))}body.append(el('p','sub',meta.join(' · ')));
  const desc=String(item.descriptionDa||item.description||'').trim();if(desc){const details=el('details','description');details.append(el('summary','','Sælgers beskrivelse'),el('p','',desc));body.append(details)}
  const a=el('a','cta','Se annonce på Tradera');a.href=url;a.target='_blank';a.rel='noopener noreferrer';body.append(a);post.append(body);fragment.append(post);
 }
 feed.append(fragment);
}
async function load(){
 try{const r=await fetch('./data/tradera-listings.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(data.status!=='ok'||!Array.isArray(data.listings))throw Error('Ugyldigt annoncefeed');
 listings=data.listings;updatedAt=data.updatedAt;const time=updatedAt?new Date(updatedAt).toLocaleString('da-DK',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'ukendt';status.textContent='Opdateret '+time;render()
 }catch(e){status.textContent='Feed ikke tilgængeligt';if(!listings.length)feed.replaceChildren(el('div','empty','Kunne ikke hente annoncer. Prøv igen senere.'))}
}
search.addEventListener('input',render);load();setInterval(()=>{if(!document.hidden&&navigator.onLine)load()},60000);
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
