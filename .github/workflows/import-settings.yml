name: Save MarginSpotter import settings
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
jobs:
  save:
    if: ${{ github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'MarginSpotter import settings' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply owner settings
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('config/tradera-watchlist.json')
          cfg=json.loads(p.read_text(encoding='utf-8'))
          try:
              request=json.loads(os.environ['ISSUE_BODY'])
              selected=request['categories']
              days=request['days']
          except (ValueError, KeyError, TypeError):
              raise SystemExit('Invalid settings payload')
          allowed=set(cfg.get('categories', {}))
          if not isinstance(selected,list) or not selected or len(selected)!=len(set(selected)) or any(not isinstance(x,str) or x not in allowed for x in selected):
              raise SystemExit('Invalid category selection')
          if type(days) is not int or days not in (1,3,7,14,30):
              raise SystemExit('Invalid day limit')
          cfg['enabledCategories']=selected
          cfg['maxDaysRemaining']=days
          cfg['queries']=[]
          p.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit settings
        run: |
          if ! git diff --quiet -- config/tradera-watchlist.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/tradera-watchlist.json
            git commit -m "Apply owner-selected MarginSpotter import settings"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
