name: Sync Tradera listings
on:
  push:
    branches: [main]
    paths:
      - 'scripts/tradera_sync.py'
      - 'config/tradera-watchlist.json'
      - '.github/workflows/tradera-sync.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      categories:
        description: "Comma-separated selected category IDs"
        required: false
        type: string
      days:
        description: "Maximum days until auction ends"
        required: false
        type: string
      query:
        description: "Exact product search term for this one-time test"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: tradera-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline translation models (optional)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --quiet argostranslate
          python - <<'PY'
          import argostranslate.package
          try:
              argostranslate.package.update_package_index()
              packages = argostranslate.package.get_available_packages()
          except Exception as error:
              print('Translation model index unavailable:', type(error).__name__)
              packages = []
          for source, target in (("sv", "da"), ("en", "da"), ("sv", "en")):
              package = next((p for p in packages if p.from_code == source and p.to_code == target), None)
              if package:
                  try:
                      argostranslate.package.install_from_path(package.download())
                  except Exception as error:
                      print(f'Optional {source}->{target} model unavailable:', type(error).__name__)
              else:
                  print(f"No direct model for {source}->{target}")
          PY
      - name: Apply requested import settings
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.categories != '' }}
        env:
          SELECTED_CATEGORIES: ${{ inputs.categories }}
          SELECTED_DAYS: ${{ inputs.days }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("config/tradera-watchlist.json")
          cfg = json.loads(p.read_text())
          allowed = set(cfg.get("categories", {}))
          selected = [v for v in os.environ["SELECTED_CATEGORIES"].split(",") if v]
          if not selected or len(selected) != len(set(selected)) or any(v not in allowed for v in selected):
              raise SystemExit("Invalid categories")
          days = int(os.environ["SELECTED_DAYS"])
          if not 1 <= days <= 30:
              raise SystemExit("Invalid days")
          cfg["enabledCategories"] = selected
          cfg["maxDaysRemaining"] = days
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n")
          PY
      - name: Fetch read-only Tradera listings
        env:
          TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID || '7762' }}
          TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
          TRADERA_TEST_QUERY: ${{ inputs.query }}
        run: python scripts/tradera_sync.py
      - name: Commit public feed if changed
        run: |
          if ! git diff --quiet -- data/tradera-listings.json config/tradera-watchlist.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tradera-listings.json config/tradera-watchlist.json
            git commit -m "Update Tradera listings feed"
            # New commits may arrive while the API fetch is running.
            # Rebase our feed-only commit onto the newest main before pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Feed changed concurrently; refusing to overwrite remote changes"
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Could not push feed after five attempts"
            exit 1
          fi
