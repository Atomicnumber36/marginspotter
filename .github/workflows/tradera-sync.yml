name: Sync Tradera listings
on:
  push:
    branches: [main]
    paths:
      - 'scripts/tradera_sync.py'
      - 'config/tradera-watchlist.json'
      - '.github/workflows/tradera-sync.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      query:
        description: "Exact product search term for this one-time test"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: tradera-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch read-only Tradera listings
        env:
          TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID || '7762' }}
          TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
          TRADERA_TEST_QUERY: ${{ inputs.query }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
        run: python scripts/tradera_sync.py
      - name: Commit public feed if changed
        run: |
          if ! git diff --quiet -- data/tradera-listings.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tradera-listings.json
            git commit -m "Update Tradera listings feed"
            # New commits may arrive while the API fetch is running.
            # Rebase our feed-only commit onto the newest main before pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Feed changed concurrently; refusing to overwrite remote changes"
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Could not push feed after five attempts"
            exit 1
          fi
